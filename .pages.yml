media:
  - name: images
    label: Images
    input: public/media
    output: /media
    categories: [image]
    rename: safe
  - name: documents
    label: Documents
    input: public/docs
    output: /docs
    categories: [document]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app

content:
  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Organization name
        type: string
        required: true
      - name: shortName
        label: Short name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Description
        type: text
      - name: email
        label: Email
        type: string
      - name: url
        label: Website URL
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: location
        label: Location
        type: string
      - name: navAbout
        label: About navigation label
        type: string
      - name: navPeople
        label: People navigation label
        type: string
      - name: navServices
        label: Services navigation label
        type: string
      - name: navProjects
        label: Projects navigation label
        type: string
      - name: navInsights
        label: Insights navigation label
        type: string
      - name: navCtaLabel
        label: Navigation CTA label
        type: string
      - name: navCtaUrl
        label: Navigation CTA URL
        type: string
      - name: footerExplore
        label: Footer explore heading
        type: string
      - name: footerConnect
        label: Footer connect heading
        type: string

  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    view:
      primary: title
      fields: [title, pageType]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: pageType
        label: Page type
        type: select
        options:
          values: [home, about, people, services, projects, insights]
        required: true
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: heroTitle
        label: Hero headline
        type: text
      - name: heroText
        label: Hero description
        type: text
      - name: sectionEyebrow
        label: Section eyebrow
        type: string
      - name: sectionTitle
        label: Section title
        type: string
      - name: sectionText
        label: Section text
        type: text
      - name: secondaryEyebrow
        label: Secondary section eyebrow
        type: string
      - name: secondaryTitle
        label: Secondary section title
        type: string
      - name: secondaryText
        label: Secondary section text
        type: text
      - name: whatWeDoTitle
        label: What we do heading
        type: string
      - name: whatWeDoText
        label: What we do description
        type: text
      - name: whatWeDoCards
        label: What we do cards
        type: object
        list: true
        fields:
          - name: number
            label: Number
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Description
            type: string
      - name: pageGroups
        label: Page groups
        type: object
        list: true
        fields:
          - name: category
            label: Category key
            type: string
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Heading
            type: string
          - name: text
            label: Description
            type: text
      - name: eventsTitle
        label: Events heading
        type: string
      - name: eventsIntro
        label: Events introduction
        type: text
      - name: upcomingLabel
        label: Upcoming label
        type: string
      - name: pastLabel
        label: Past label
        type: string
      - name: selectedWorkTitle
        label: Selected work heading
        type: string
      - name: selectedWorkIntro
        label: Selected work introduction
        type: text
      - name: insightsTitle
        label: Insights heading
        type: string
      - name: insightsIntro
        label: Insights introduction
        type: text
      - name: ctaTitle
        label: CTA heading
        type: string
      - name: ctaText
        label: CTA text
        type: text
      - name: ctaLabel
        label: CTA button
        type: string
      - name: ctaUrl
        label: CTA URL
        type: string
      - name: body
        label: Page content
        type: rich-text
      - name: metaDescription
        label: SEO meta description
        type: text

  - name: people
    label: People
    type: collection
    path: src/content/people
    view:
      primary: name
      fields: [name, category, position]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Researchers, Management, Advisors]
        required: true
      - name: position
        label: Position
        type: string
      - name: photo
        label: Photo
        type: image
        options:
          media: images
      - name: shortBio
        label: Short bio
        type: text
      - name: expertise
        label: Areas of expertise
        type: string
        list: true
      - name: education
        label: Education
        type: string
        list: true
      - name: linkedin
        label: LinkedIn
        type: string
      - name: email
        label: Email
        type: string
      - name: order
        label: Display order
        type: number
      - name: active
        label: Active
        type: boolean
      - name: body
        label: Full biography
        type: rich-text
        options:
          media: images

  - name: events
    label: Events
    type: collection
    path: src/content/events
    view:
      primary: title
      fields: [title, date, location]
    fields:
      - name: title
        label: Event title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: endDate
        label: End date
        type: date
      - name: time
        label: Time
        type: string
      - name: location
        label: Location
        type: string
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: summary
        label: Brief description
        type: text
      - name: rsvpEnabled
        label: Enable RSVP
        type: boolean
      - name: rsvpUrl
        label: RSVP URL
        type: string
      - name: registrationDeadline
        label: Registration deadline
        type: date
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: body
        label: Event details
        type: rich-text
        options:
          media: images

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    view:
      primary: title
      fields: [title, status, year]
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        options:
          values: [Ongoing, Completed, Upcoming]
      - name: year
        label: Year
        type: string
      - name: client
        label: Client / partner
        type: string
      - name: location
        label: Geographic focus
        type: string
      - name: image
        label: Featured image
        type: image
        options:
          media: images
      - name: summary
        label: Short description
        type: text
      - name: themes
        label: Research themes
        type: string
        list: true
      - name: researchers
        label: Researchers
        type: reference
        options:
          collection: people
          multiple: true
          search: "name"
      - name: outputs
        label: Outputs
        type: string
        list: true
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: body
        label: Project details
        type: rich-text
        options:
          media: images

  - name: services
    label: Services
    type: collection
    path: src/content/services
    view:
      primary: title
      fields: [title, number]
    fields:
      - name: title
        label: Service title
        type: string
        required: true
      - name: number
        label: Number
        type: string
      - name: summary
        label: Summary
        type: text
      - name: capabilities
        label: Capabilities
        type: string
        list: true
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: order
        label: Display order
        type: number
      - name: body
        label: Full description
        type: rich-text
        options:
          media: images

  - name: insights
    label: Insights
    type: collection
    path: src/content/insights
    view:
      primary: title
      fields: [title, type, date]
      sort: date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: type
        label: Content type
        type: select
        options:
          values: [Research Note, Policy Brief, Article, Report, Blog]
      - name: date
        label: Publication date
        type: date
      - name: author
        label: Author(s)
        type: string
        list: true
      - name: image
        label: Featured image
        type: image
        options:
          media: images
      - name: excerpt
        label: Excerpt
        type: text
      - name: pdf
        label: PDF
        type: file
        options:
          media: documents
          extensions: [pdf]
      - name: project
        label: Related project
        type: reference
        options:
          collection: projects
      - name: tags
        label: Tags
        type: string
        list: true
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: body
        label: Content
        type: rich-text
        options:
          media: images
