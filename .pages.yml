media:
  folder: public/images
  publicPath: /images

content:
  - name: settings
    label: Site Settings
    type: file
    file: src/content/settings/site.json
    fields:
      - name: site_title
        type: string
      - name: logo
        label: Site Logo
        type: image
      - name: favicon
        label: Favicon
        type: image

  - name: pages
    label: Standard Pages
    type: collection
    folder: src/content/pages
    fields:
      - name: title
        type: string
      - name: hero_image
        label: Hero Background Image (Homepage only)
        type: image
      - name: body
        type: rich-text

  - name: people
    label: Team Members
    type: collection
    folder: src/content/people
    fields:
      - name: name
        type: string
      - name: category
        label: Role Category
        type: select
        options:
          - Researchers
          - Management
          - Advisors
      - name: photo
        type: image
      - name: body
        type: rich-text

  - name: events
    label: Events
    type: collection
    folder: src/content/events
    fields:
      - name: title
        type: string
      - name: date
        type: date
      - name: image
        type: image
      - name: status
        type: select
        options:
          - Upcoming
          - Past
      - name: rsvp_link
        label: RSVP URL
        type: string
      - name: body
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    folder: src/content/projects
    fields:
      - name: title
        type: string
      - name: summary
        label: Short Summary (for the main projects page)
        type: text
      - name: cover_image
        type: image
      - name: body
        type: rich-text

  - name: insights
    label: Insights & Articles
    type: collection
    folder: src/content/insights
    fields:
      - name: title
        type: string
      - name: date
        type: date
      - name: author
        type: string
      - name: cover_image
        type: image
      - name: summary
        type: text
      - name: body
        type: rich-text
