media:
  folder: public/images
  publicPath: /images

content:
  - name: settings
    label: Site Settings
    type: file
    file: content/settings.md
    fields:
      - name: site_title
        type: string
      - name: logo
        label: Site Logo (Full Logo.png)
        type: image
      - name: favicon
        label: Favicon (favicon.png)
        type: image
      - name: base_font_size
        type: string
        description: "e.g., 16px or 1rem"

  - name: pages
    label: Standard Pages
    type: collection
    folder: content/pages
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text

  - name: homepage
    label: Homepage Sections
    type: file
    file: content/homepage.md
    fields:
      - name: hero_image
        label: Hero Background Image (hero.png)
        type: image
      - name: hero_title
        type: string
      - name: hero_subtitle
        type: string
      - name: what_we_do_body
        label: "What We Do - Description"
        type: rich-text

  - name: people
    label: Team Members
    type: collection
    folder: content/people
    fields:
      - name: name
        type: string
      - name: category
        label: Role Category
        type: select
        options:
          - Researchers
          - Management
          - Advisors
      - name: photo
        type: image
      - name: bio
        type: rich-text

  - name: events
    label: Events
    type: collection
    folder: content/events
    fields:
      - name: title
        type: string
      - name: date
        type: date
      - name: image
        type: image
      - name: status
        type: select
        options:
          - Upcoming
          - Past
      - name: rsvp_link
        label: RSVP URL (for upcoming events)
        type: string
      - name: description
        type: rich-text
